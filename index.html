<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#102A4C" />
    <!-- Install names stay the same even when the current page has its own title. -->
    <meta name="application-name" content="The Sci Club" />
    <meta name="apple-mobile-web-app-title" content="The Sci Club" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- favicon.ico first, for browsers and bookmark tools that still look for
         it by convention. The PNGs are what modern browsers actually pick. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Large icons also cover browsers that create a shortcut without reading the manifest. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Member pages are never public (CONTEXT.md). Keep the whole app out of indexes. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>The Sci Club</title>
    <!-- The club's address is thesciclub.com (2026-10-03). Anybody on the old
         Netlify address, in a browser or in a Home Screen app installed from
         it, is moved to the same page there. In the page and not a Netlify
         redirect: an installed app's service worker answers from its own copy
         and never sees a server redirect, and redirecting /sw.js across
         domains would stop that copy from ever updating. The static /privacy
         and /terms still answer here for checkers that run no script, which
         the text-message registration's links rely on. Deploy previews have
         other host names and are left alone. -->
    <script>
      if (location.hostname === 'thesciclub.netlify.app') {
        location.replace(
          'https://thesciclub.com' + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <!-- Light or dark before the first paint, from the setting on Me → Display
         (src/lib/accessibility.tsx keeps it in step after that). Without this a
         member who chose Dark sees a white flash on every launch. -->
    <script>
      try {
        const appearance = JSON.parse(
          localStorage.getItem('thesciclub.accessibility') || '{}',
        ).appearance;
        if (appearance === 'light' || appearance === 'dark') {
          document.documentElement.dataset.appearance = appearance;
        }
        // /join is always light: see useForceLight in src/lib/accessibility.tsx.
        const joining = location.pathname === '/join';
        if (joining) document.documentElement.dataset.forceLight = '';
        const dark =
          !joining &&
          (appearance === 'dark' ||
            (appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#141619';
      } catch {
        // Storage blocked: the phone's own setting applies, through the CSS.
      }
    </script>
    <!-- The club's data is on another origin (Supabase). Connecting while the
         script downloads saves the first read its DNS, TCP and TLS. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Opening on Home, the member's door check and Home's feed are asked for
         here, while the app's script downloads, rather than once it has
         started (the owner, 2026-11-21: a second on a slow phone). Only with a
         session already on this device that is not about to run out; the app
         takes them up in src/lib/early-start.ts, and asks again itself for
         anything that did not come. The address and key come from this tag, so
         the script's text, and its hash in the security policy, are the same
         on every site. -->
    <meta name="club-data" content="%VITE_SUPABASE_URL%" data-key="%VITE_SUPABASE_ANON_KEY%" />
    <script>
      try {
        const data = document.querySelector('meta[name="club-data"]');
        const url = data && data.content;
        const key = data && data.dataset.key;
        const home = location.pathname.replace(/\/+$/, '') === '/home';
        if (home && url && key && url.indexOf('%') < 0 && window.fetch) {
          const ref = new URL(url).hostname.split('.')[0];
          const session = JSON.parse(localStorage.getItem('sb-' + ref + '-auth-token') || 'null');
          if (
            session &&
            session.access_token &&
            session.user &&
            session.expires_at * 1000 > Date.now() + 60000
          ) {
            const headers = { apikey: key, Authorization: 'Bearer ' + session.access_token };
            const json = (response) => (response.ok ? response.json() : Promise.reject(response.status));
            const member = fetch(
              url + '/rest/v1/members?select=id,is_admin,display_name,status&id=eq.' + session.user.id,
              { headers: headers },
            ).then(json);
            const feed = fetch(url + '/rest/v1/rpc/home_feed', {
              method: 'POST',
              headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
              body: JSON.stringify({ p_show: 'all', p_sort: 'ranking', max_rows: 40 }),
            }).then(json);
            // Unclaimed, a failure stays quiet; the app reads again itself.
            member.catch(() => undefined);
            feed.catch(() => undefined);
            window.__clubEarly = { user: session.user.id, at: Date.now(), member: member, feed: feed };
          }
        }
      } catch {
        // Nothing started: the app reads as it always did.
      }
    </script>
    <!-- Both faces are served from this site, never Google Fonts: a private
         club should not tell a third party each time a member opens it.
         Preloaded so the first screen is drawn in them rather than swapped
         into them. -->
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegibleNext-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Outfit-Bold-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
