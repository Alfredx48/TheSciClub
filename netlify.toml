# Netlify serves the club at https://thesciclub.com (www redirects to it). The
# old thesciclub.netlify.app address still answers, and the page itself sends
# people on to thesciclub.com (index.html says why it is not a redirect here). Builds `main`. Until 2026-10-03 the domain served the design mock
# from docs/ on GitHub Pages; that mock is gone (CONTEXT.md, "Working model").

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Corepack so the pinned pnpm in package.json is the one that runs.
  NPM_FLAGS = "--version"

# On tests.thesciclub.com only (TEST_SUPABASE_REF set), the headers below name
# its own Supabase project instead of the live one. Does nothing here.
[[plugins]]
  package = "/netlify/plugins/test-backend"

# A single-page app: every path is served by index.html and routed in the
# browser. Without this, /peers and /join 404 on a refresh or a shared link —
# they work when you navigate to them and break when you reload, which is the
# confusing half of the bug.
# Android's "Share to The SCI Club" posts here. The service worker answers it
# (src/sw.ts); this is only for a share that reaches the server because the
# worker was not running yet. A 302, so the browser follows with a GET and
# /share says nothing was kept, rather than a 404.
[[redirects]]
  from = "/share-target"
  to = "/share"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The store app's YouTube player (public/embed/youtube.html) gets its own
# headers from an edge function, as Netlify did not reliably let a second
# header rule win over "/*" below. Exactly this path; every other page keeps
# the site-wide policy.
[[edge_functions]]
  path = "/embed/youtube.html"
  function = "youtube-embed"

# What a text message shows for a link to an event. Only for what fetches
# previews; a member's browser goes straight on.
[[edge_functions]]
  path = "/e/*"
  function = "event-preview"

[[edge_functions]]
  path = "/events/*"
  function = "event-preview"

# And a link to the organizations' map.
[[edge_functions]]
  path = "/events"
  function = "event-preview"

# And a link to a question: its words only when an administrator shared it to
# let people in (topic-preview.ts); otherwise the club, and nothing of the post.
[[edge_functions]]
  path = "/chat/rooms/*"
  function = "topic-preview"

[[headers]]
  for = "/*"
  [headers.values]
    # index.html already carries a noindex meta. This is the same instruction
    # in a header, which is what a crawler sees first and what covers the
    # responses that are not HTML.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here needs a camera, a microphone, or a location beyond the one
    # the location step asks for explicitly.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # What the page may load, and from where. A member's session lives in
    # localStorage, so script that is not the club's own could read it and
    # act as them; this is what stops a script that got in from running, or
    # from sending anything anywhere if it did (a security checklist,
    # 2026-10-03). In order:
    #   script-src   the bundle, the service worker's registration, and the
    #                two inline scripts in index.html by hash: the move off
    #                thesciclub.netlify.app and the appearance before first
    #                paint. Edit either and its hash changes;
    #                src/csp.test.ts says which one and gives the new value.
    #                And Google's sign-in script, the one script from
    #                elsewhere: it lists the Google accounts in the browser
    #                on /join and on Me (src/lib/google-identity.ts,
    #                2026-10-07). Only that file, not all of Google. Never
    #                Cloudflare's analytics script: it runs in a frame of
    #                its own (frame-src, src/lib/web-analytics.ts).
    #   style-src    the built stylesheet, the sign-in script's own, and
    #                inline styles, because Google's button writes a <style>
    #                and style attributes: without them it drew a G the size
    #                of the page and its own frame at no height (2026-10-07,
    #                reproduced under this policy). Styles only, never
    #                script. A style cannot fetch from anywhere img-src and
    #                font-src do not allow, which is what keeps that small. React's style props are set through
    #                the DOM, which a policy does not govern.
    #   img-src      the club's own files, photo previews before upload
    #                (blob:), and photos, chat pictures and organization logos
    #                from Supabase storage.
    #   connect-src  Supabase (REST, auth, storage, and realtime over wss) and
    #                the geocoder the location step asks for a ZIP or a place,
    #                Photon, which suggests a location's street address to an
    #                administrator or organization account as they type
    #                (src/lib/address-suggestions.ts), and Google's sign-in,
    #                which checks the browser's accounts.
    #                And the map's tiles, from the club's Worker on R2
    #                (TILES_ORIGIN in src/lib/map/tiles.ts; change both).
    #                And a Google Sheet an administrator invites a list from,
    #                read as CSV (src/lib/invite-sheet.ts, 2026-11-14).
    #   frame-src    YouTube's privacy-enhanced player: a video under a link
    #                plays in place once somebody presses play
    #                (src/routes/chat/link-preview-card.tsx, 2026-10-06). And
    #                Google's sign-in button and account list, which are
    #                Google's page in a frame. And the visit counter, on
    #                its own origin so Cloudflare's script there cannot read
    #                a session (count-worker/, src/lib/web-analytics.ts).
    #   frame-ancestors  no other site may show the club inside a frame, where
    #                it could dress the sign-in page in its own clothes (an
    #                external audit, 2026-10-03, framed /join from another
    #                origin). X-Frame-Options below is the same rule for
    #                browsers that predate frame-ancestors.
    # A deploy preview talks to the same Supabase project, so this holds there
    # too. `pnpm dev` does not read this file.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Xy2xEANIw9pW886w6DVJgHrrPL/27Q6sFs2Uuu/pmKE=' 'sha256-n2STVZqH8GraCglqUjF3hPzj2VYdFF0SX66U5zowe3M=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: https://erijdvqnxavwezsbbojv.supabase.co; font-src 'self'; connect-src 'self' https://erijdvqnxavwezsbbojv.supabase.co wss://erijdvqnxavwezsbbojv.supabase.co https://nominatim.openstreetmap.org https://photon.komoot.io https://lh3.googleusercontent.com https://accounts.google.com/gsi/ https://sciclub-tiles.thesciclub.workers.dev/ https://docs.google.com/spreadsheets/; frame-src https://www.youtube-nocookie.com https://accounts.google.com/gsi/ https://sciclub-count.thesciclub.workers.dev/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"

# Which links open the store app (Universal Links). Apple fetches it from
# here, with no redirect, and wants JSON though the name has no extension.
# The file is real, so the catch-all above never answers for it.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# The oldest iPhone app that still works (src/lib/app-update.ts). The app reads
# it from capacitor://localhost, so it needs CORS, and fresh on every look.
[[headers]]
  for = "/app-update.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Built scripts and styles carry a hash of their contents in the name, so a
# copy never goes stale: a new build is a new name. Kept a year rather than
# Netlify's default of asking again on every load (max-age=0), which cost a
# round trip per file on every visit without the service worker. Netlify
# applies every matching block, so the headers above still apply here.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and the club's pictures are not renamed per build, so a week and a
# day rather than a year: a changed one reaches a browser tab within that
# (give a changed font a new name, as Outfit-Bold-latin.woff2 was). The
# installed app has them from its own precache either way.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The map's glyphs and sprites. A changed file goes in a new folder (v2).
[[headers]]
  for = "/map/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
